name: Violet Command Center

on:
  pull_request:
    paths:
      - "examples/violet-command-center/**"
      - ".github/workflows/violet-command-center.yml"
  push:
    paths:
      - "examples/violet-command-center/**"
      - ".github/workflows/violet-command-center.yml"

jobs:
  test:
    name: Test standalone frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: examples/violet-command-center
