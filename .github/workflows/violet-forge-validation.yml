name: Violet Forge validation
on:
  pull_request:
    paths:
      - 'apps/violet-forge/**'
      - '.github/workflows/violet-forge-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Violet Forge security and QA gates
        run: node apps/violet-forge/scripts/validate-violet-forge.mjs
